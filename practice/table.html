<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <style>
        table,th,td{
            border: 2px;
            border-color: black;
            border-style: solid;
              
        }
    </style>
</head>
<body>
    <table>
        <thead >product list</thead>
        <tr>
            <th>item</th>
            <th>quantity</th>
            <th>Price</th>
            <th>Extended</th>
        </tr>
        <tr>
            <td>Hard disk</td>
            <td>1</td>
            <td>500$</td>
            <td>400$</td>
        </tr>
        <tr>
            <td>cd drive</td>
            <td>1</td>
            <td>200$</td>
            <td>500$</td>
        </tr>
        <tr>
            <td colspan="3" style="text-align: right;" ><b>total amount</b></td>
            <td >900$</td>
        </tr>

    </table>
</body>
</html>
